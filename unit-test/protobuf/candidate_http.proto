syntax = "proto3";
package candidate_http;

import "google/protobuf/timestamp.proto";

// ── Shared enums (mirrors dto/mod.rs) ──────────────────────────────────────

enum AssessmentFont {
    SMALL  = 0;
    NORMAL = 1;
    LARGE  = 2;
}

enum SectionType {
    OBJECTIVE = 0;
    THEORY    = 1;
}

enum BlockType {
    SINGLE_QUESTIONS = 0;
    PASSAGES         = 1;
}

enum AttemptRule {
    ATTEMPT_ALL = 0;
    ATTEMPT_ANY = 1;
}

enum ItemType {
    MCQ                  = 0;
    MRQ                  = 1;
    ESSAY_PLAIN_TEXT     = 2;
    ESSAY_RICH_TEXT      = 3;
    CLOZE_TEXT           = 4;
    CLOZE_DROPDOWN       = 5;
    SHORT_TEXT           = 6;
    TRUE_FALSE           = 7;
    YES_NO               = 8;
    ASSOCIATION          = 9;
    CHOICE_MATRIX        = 10;
    ORDER_LIST           = 11;
    CLOZE_TEXT_IMAGE     = 12;
    CLOZE_DROPDOWN_IMAGE = 13;
    IMAGE_DRAG_AND_DROP  = 14;
    DRAWING_AND_WRITING  = 15;
    CLOZERADIO           = 16;
}

enum BackgroundType {
    BG_NONE  = 0;
    BG_GRID  = 1;
    BG_LINE  = 2;
    BG_GRAPH = 3;
}

enum DrawingWritingSplitType {
    FULL  = 0;
    SPLIT = 1;
}

enum ResponsePositionDirection {
    LEFT  = 0;
    RIGHT = 1;
}

// ── Shared leaf messages ────────────────────────────────────────────────────

message OptionDto {
    string label = 1;
    string value = 2;
}

message ImageData {
    string image      = 1;
    string alt_text   = 2;
    int32  width      = 3;
    int32  height     = 4;
    string dimension  = 5;
}

message ResponsePosition {
    float                   x         = 1;
    float                   y         = 2;
    ResponsePositionDirection direction = 3;
    float                     width     = 4;
    float                     height    = 5;
}

message SubQuestion {
    string          id              = 1;
    string          stimulus        = 2;
    int32           score           = 3;
    optional BackgroundType background_type = 4;
    repeated SubQuestion    children        = 5;
}

message PossibleResponseCandidate {
    repeated OptionDto responses = 1;
}

// ── Outbound: login response (server → client) ─────────────────────────────

message CandidateLoginResponseProto {
    CandidateDataProto                    candidate_data     = 1;
    repeated CandidateSectionsOverviewProto sections_overview  = 2;
    CandidateAssessmentDataProto          assessment_data    = 3;
    repeated CandidateSectionQuestionsProto sections_questions = 4;
    bytes  events_session_id  = 5;
    uint64 last_sequence      = 6;
    uint64 resume_elapsed_ms  = 7;
}

message CandidateDataProto {
    string          name              = 1;
    int32           id                = 2;
    int32           minutes_left      = 3;
    int32           seconds_left      = 4;
    string          login_field_value = 5;
    repeated bytes  section_ids       = 6;
    repeated google.protobuf.Timestamp login_times = 7;
    optional bytes  participant_id    = 8;
    string          accessibility_support = 9;
}

message CandidateSectionsOverviewProto {
    string name            = 1;
    int32  total_questions = 2;
    int32  duration        = 3;
}

message CandidateAssessmentDataProto {
    string          name                              = 1;
    optional string start_exam_instruction            = 2;
    optional string end_exam_instruction              = 3;
    int32           duration_minutes                  = 4;
    bool            display_all_sections_at_once      = 5;
    int32           instruction_read_time_sec         = 6;
    int32           warn_end_of_reading_time_sec      = 7;
    int32           auto_save_sec                     = 8;
    int32           inactivity_warning_sec            = 9;
    bool            warn_unattempted_questions        = 10;
    bool            end_exam_confirmation             = 11;
    int32           allow_end_exam_after_x_questions  = 12;
    bool            preserve_section_order            = 13;
    AssessmentFont  font_size                         = 14;
    int32           compensatory_time_value           = 15;
    bool            allow_block_navigation            = 16;
    bool            use_biometrics                    = 17;
    int32           candidate_grace_period_minutes    = 18;
    google.protobuf.Timestamp start_date              = 19;
    google.protobuf.Timestamp exam_start_time         = 20;
}

message CandidateSectionQuestionsProto {
    string                        name             = 1;
    bytes                         id               = 2;
    CandidateSectionSettingsProto section_settings = 3;
    repeated CandidateSectionBlocksProto question_blocks = 4;
    SectionType                   section_type     = 5;
}

message CandidateSectionSettingsProto {
    int32           minutes_left                            = 1;
    int32           seconds_left                            = 2;
    int32           duration_in_minutes                     = 3;
    bool            shuffle_items                           = 4;
    bool            shuffle_options                         = 5;
    bool            allow_calculator                        = 6;
    bool            shuffle_blocks                          = 7;
    bool            prevent_navigation_to_attempted_items   = 8;
    optional string section_instruction                     = 9;
}

message CandidateSectionBlocksProto {
    int64                       id              = 1;
    int32                       total_questions = 2;
    int32                       index           = 3;
    BlockType                   block_type      = 4;
    repeated CandidateItemProto items           = 5;
    repeated CandidatePassageItemProto passages = 6;
    string                      name            = 7;
    AttemptRule                 attempt_rule    = 8;
    int32                       items_to_attempt = 9;
    optional string             instruction     = 10;
}

message CandidateItemProto {
    bytes                               id                          = 1;
    optional string                     passage_stimulus            = 2;
    string                              reference                   = 3;
    string                              stimulus                    = 4;
    repeated OptionDto                  options                     = 5;
    repeated string                     stems                       = 6;
    repeated PossibleResponseCandidate  possible_responses          = 7;
    repeated ResponsePosition           response_positions          = 8;
    repeated OptionDto                  distractors                 = 9;
    ItemType                            item_type                   = 10;
    bool                                numerical                   = 11;
    bool                                case_sensitive              = 12;
    bool                                shuffle_options             = 13;
    bool                                multiple_response           = 14;
    int32                               max_words                   = 15;
    int32                               max_length                  = 16;
    bool                                allow_paste                 = 17;
    bool                                allow_copy                  = 18;
    bool                                allow_cut                   = 19;
    bool                                plain_text                  = 20;
    repeated string                     responses                   = 21;
    bool                                revisit                     = 22;
    int32                               max_responses               = 23;
    optional ImageData                  image_data                  = 24;
    bool                                allow_stop                  = 25;
    bool                                allow_pause                 = 26;
    bool                                beep_when_recording_starts  = 27;
    bool                                warn_overwrite              = 28;
    bool                                paper_response              = 29;
    int32                               max_duration                = 30;
    optional BackgroundType             background_type             = 31;
    optional DrawingWritingSplitType    drawing_writing_split_type  = 32;
    repeated SubQuestion                sub_questions               = 33;
}

message CandidatePassageItemProto {
    bytes                       id       = 1;
    string                      stimulus = 2;
    repeated CandidateItemProto items    = 3;
}

// ── Inbound: autosave (client → server) ────────────────────────────────────

message CandidateAutoSaveHttpProto {
    map<string, SectionItemsProto>     sections_map    = 1;
    map<string, SectionTimesHttpProto> section_times   = 2;
    int32                              minutes         = 3;
    int32                              seconds         = 4;
    int64                              cand_id         = 5;
    BatteryStatusProto                 battery_status  = 6;
    repeated CandidateClientEventProto pending_events  = 7;
}

message SectionItemsProto {
    repeated CandidateAutoSaveItemHttpProto items = 1;
}

message SectionTimesHttpProto {
    int32 minutes = 1;
    int32 seconds = 2;
}

message CandidateAutoSaveItemHttpProto {
    bytes           item_id      = 1;
    int64           blk_id       = 2;
    repeated string answers      = 3;
    bool            revisit_later = 4;
    string          item_type    = 5;
}

message BatteryStatusProto {
    oneof status {
        bool             none   = 1;
        BatteryChargeProto charge = 2;
    }
}

message BatteryChargeProto {
    int32 percentage = 1;
    bool  charging   = 2;
}

message CandidateClientEventProto {
    bytes           event_id           = 1;
    bytes           events_session_id  = 2;
    int64           sequence           = 3;
    string          event_type         = 4;
    int64           elapsed_ms         = 5;
    optional bytes  section_id         = 6;
    optional bytes  question_id        = 7;
    optional string answer             = 8;
    optional string old_answer         = 9;
    optional string navigation_method  = 10;
    optional int64  duration_ms        = 11;
    optional int32  battery_level      = 12;
}

// ── Inbound: end exam (client → server) ────────────────────────────────────

message CandidateEndExamHttpProto {
    bool                        timed_out           = 1;
    CandidateAutoSaveHttpProto  autosave            = 2;
    bool                        is_drawing_writing  = 3;
}
