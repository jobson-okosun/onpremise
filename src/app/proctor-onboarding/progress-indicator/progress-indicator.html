<div class="flex flex-col lg:flex-row items-center justify-between w-full gap-4 lg:gap-0">
    <div class="flex flex-row items-center gap-3 w-full lg:w-48 xl:w-64 justify-center lg:justify-start">
        <button type="button" (click)="confirmRestart($event)" class="group flex items-center gap-2 px-4 py-1.5 rounded-full shadow-md border border-red-300 bg-white transition-all duration-300 text-sm font-semibold text-red-500">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" class="text-red-500" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 9L21 15"></path>
                <path d="M5.27643 14.9351L7.99539 17.3928C10.1441 19.335 11.2184 20.3061 12.1092 19.9143C13 19.5225 13 18.0788 13 15.1915V15H14C15.4142 15 16.1213 15 16.5607 14.5607C17 14.1213 17 13.4142 17 12C17 10.5858 17 9.87868 16.5607 9.43934C16.1213 9 15.4142 9 14 9H13V8.80852C13 5.92117 13 4.47749 12.1092 4.08568C11.2184 3.69387 10.1441 4.66499 7.99538 6.60723L5.27642 9.06495C3.75881 10.4367 3 11.1226 3 12C3 12.8774 3.75881 13.5633 5.27643 14.9351Z"></path>
            </svg>
            <span>Back to login?</span>
        </button>
    </div>

    <!-- Center Progress Area -->
    <div class="flex items-center justify-center gap-1 flex-1 overflow-x-auto no-scrollbar w-full py-1">
        @for (step of steps(); track step.id; let i = $index) {
            <button
                type="button"
                class="step-item"
                [class.active]="i === currentStep()"
                [class.completed]="i < currentStep()"
                [class.disabled]="i > reachableStepCount()"
                [disabled]="i > reachableStepCount()"
                (click)="moveStep(i)"
                [attr.aria-label]="step.label">
                <span class="step-icon">
                    @switch (step.icon) {
                        @case ('info') {
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="12" y1="16" x2="12" y2="12"/>
                                <line x1="12" y1="8" x2="12.01" y2="8"/>
                            </svg>
                        }
                        @case ('monitor') {
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                                <line x1="8" y1="21" x2="16" y2="21"/>
                                <line x1="12" y1="17" x2="12" y2="21"/>
                            </svg>
                        }
                        @case ('book') {
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                            </svg>
                        }
                        @case ('clipboard') {
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                                <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                            </svg>
                        }
                        @case ('mic') {
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                <line x1="12" y1="19" x2="12" y2="22"/>
                            </svg>
                        }
                        @case ('camera') {
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M15 10l4.553-2.276A1 1 0 0 1 21 8.618v6.764a1 1 0 0 1-1.447.894L15 14v-4z"/>
                                <rect x="3" y="6" width="12" height="12" rx="2" ry="2"/>
                            </svg>
                        }
                        @case ('user') {
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        }
                        @case ('play') {
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="5 3 19 12 5 21 5 3"/>
                            </svg>
                        }
                    }
                </span>
                <span class="step-label">{{ step.label }}</span>
            </button>
            @if (i < steps().length - 1) {
                <span class="step-divider" [class.completed]="i < currentStep()"></span>
            }
        }
    </div>
    <!-- Right Spacing for perfect centering -->
    <div class="hidden lg:block lg:w-48 xl:w-64"></div>
</div>

<p-dialog [visible]="showRestartModal()" [modal]="true" [closable]="false" [focusOnShow]="false" [draggable]="false" [resizable]="false" [style]="{ width: '450px' }" class="p-0">
  <div class="text-center p-8">
    <div class="mb-6 flex justify-center text-red-500">
        <svg class="bg-red-50 p-4 rounded-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="90" height="90" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
    </div>
    
    <h3 class="text-2xl font-bold text-gray-800 mb-3">Start over?</h3>
    <p class="text-gray-600 mb-8 text-sm">
        Are you sure you want to restart the onboarding process? You will be taken back to the login process.
    </p>

    <div class="flex justify-center gap-4">
        <button type="button" (click)="cancelRestart()" class="bg-gray-100 text-gray-700 px-6 py-2.5 rounded hover:bg-gray-200 font-semibold transition w-full">Cancel</button>
        <button type="button" (click)="doRestart()" class="bg-primary text-white px-6 py-2.5 rounded hover:bg-primary/90 font-semibold transition w-full shadow-md">Yes, Restart</button>
    </div>
  </div>
</p-dialog>
