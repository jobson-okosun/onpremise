<div animate.enter="fade-in">
    <div>
        <div class="uppercase font-black text-xl text-primary">Exam Details</div>
        <div class="mt-2">Confirm the exam information below before continuing.</div>
    </div>

    <div class="flex flex-col gap-2 mt-5">
        <div><span class="font-semibold">Sections: </span> {{ store().sections.length }}</div>
        <div><span class="font-semibold">Exam Duration: </span> {{ examDuration() }} mins</div>
    </div>

    <div class="mt-5">
        <div class="font-bold text-lg border-y border-gray-200 border-dashed py-3 mt-10 mb-5 uppercase">Sections</div>
        <div class="flex flex-col gap-2">
            @for(item of store().sections; track item; let i = $index) {
                <div class="flex items-center gap-4">
                    <span class="rounded-full bg-gray-50 border border-gray-200/60 size-10 xl:size-12 flex items-center justify-center">
                        {{ i + 1 }}
                    </span>
                    <span>{{ item.name }}</span>
                </div>
            } 
        </div>
    </div>
</div>
