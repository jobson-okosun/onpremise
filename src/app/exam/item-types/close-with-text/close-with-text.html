<div class="h-full">
    <div class="lg:h-full overflow-hidden">
        <div class="rounded-md bg-white h-full flex flex-col">
            <div class="py-1 pr-2">
                <div class="border-l-4 border-primary flex justify-between items-center">
                    <div class="font-bold text-sm px-3">
                        <div class="text-primary">{{ store().currentSection?.name }}</div>
                        <div>Question {{ store().currentQuestionIndex + 1 }}</div>
                    </div>
                    <div class="flex gap-3">
                        <app-answer-tools></app-answer-tools>
                        @if(!store().isPreviewMode) {
                            <app-question-tools [showQuestionModalButton]="false" [showQuestionModalButton]="false"></app-question-tools>
                        }
                    </div>
                </div>
            </div>

            <div [style.fontSize.px]="fontSize()" class="overflow-auto h-[400px] lg:h-full p-3 border-t border-gray-300 border-dashed">

                @if (store().currentQuestion?.passage_stimulus) {
                    <div class="editor-content" [innerHTML]="store().currentQuestion?.passage_stimulus | safeHtml"></div>
                }

            <div class="mt-3 editor-content" #contentContainer [innerHTML]="formattedStimulus() | safeHtml"></div>

            <div class="hidden">
                @for(i of clozeRenderArray(); track $index) {
                    <span #clozeDropdown class="inline-block align-middle">
                        <input [style.fontSize.px]="fontSize()" [value]="store().currentQuestion?.responses?.[i] ?? ''" class="border border-gray-300 rounded-md outline-none ring-0 text-sm p-2 m-1 inline close-item md:w-auto w-full" #dropRef (input)="captureResponses(i, dropRef.value)">   
                    </span>
                }
            </div>
            </div>

        </div>
    </div>
</div>
