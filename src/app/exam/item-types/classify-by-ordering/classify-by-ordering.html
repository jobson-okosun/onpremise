<div class="h-full w-full overflow-y-auto lg:overlow-hidden flex flex-col lg:flex-row gap-3 2xl:gap-5">
    <!-- question -->
    <div class="lg:w-1/2 lg:h-full lg:overflow-hidden">
        <div class="rounded-md bg-white h-full flex flex-col">
            <div class="py-1 pr-2">
                <div class="border-l-4 border-primary flex justify-between items-center">
                    <div class="font-bold text-sm px-3">
                        <div class="text-primary">{{ store().currentSection?.name }}</div>
                        <div>Question {{ store().currentQuestionIndex + 1 }}</div>
                    </div>
                    <app-question-tools [showToggleLayoutButton]="true" [showQuestionModalButton]="false"></app-question-tools>
                </div>
            </div>

            <div [style.fontSize.px]="fontSize()" class="flex-1 overflow-y-auto p-3 border-t border-gray-300 border-dashed">
                @if(store().currentQuestion?.passage_stimulus) { 
                    <div [innerHTML]="store().currentQuestion?.passage_stimulus"></div> 
                }

                @if(store().currentQuestion?.stimulus) { 
                    <div [innerHTML]="store().currentQuestion?.stimulus" [class.mt-5]="store().currentQuestion?.passage_stimulus"></div> 
                } 
            </div>
        </div>
    </div> 
    
    <!-- answer -->
    <div class="lg:w-1/2">
        <div class="rounded-md bg-white h-full flex flex-col">
            <div class="p-1.5">
                <div class="border-l-4 border-primary flex justify-between items-center">
                    <div class="font-bold text-sm px-3">Answer</div> <app-answer-tools></app-answer-tools>
                </div>
            </div>
            <div class="answer-space flex-1 overflow-y-auto border-t border-gray-300 border-dashed p-1">
                <div #wrapper class="relative bg-gray-100 p-5">
                    <div class="relative">
                        <div cdkDropList (cdkDropListDropped)="drop($event)" class="drag-container flex flex-col gap-4"> 
                            @for (item of rightItems(); track item.label; let i = $index) { 
                                <div cdkDrag class="drag-item p-4 bg-white rounded-xl border border-gray-200 cursor-move select-none relative flex justify-between">
                                    <span [style.fontSize.px]="fontSize()" [innerHTML]="item.label"></span> 
                                    <span class="flex items-center justify-center">
                                        <svg class="opacity-40" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#cac8c8" fill="none" stroke="#141B34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M6 5C6.55228 5 7 5.44772 7 6C7 6.55228 6.55228 7 6 7C5.44772 7 5 6.55228 5 6C5 5.44772 5.44772 5 6 5Z" />
                                            <path d="M6 11C6.55228 11 7 11.4477 7 12C7 12.5523 6.55228 13 6 13C5.44772 13 5 12.5523 5 12C5 11.4477 5.44772 11 6 11Z" />
                                            <path d="M6 17C6.55228 17 7 17.4477 7 18C7 18.5523 6.55228 19 6 19C5.44772 19 5 18.5523 5 18C5 17.4477 5.44772 17 6 17Z" />
                                            <path d="M18 5C18.5523 5 19 5.44772 19 6C19 6.55228 18.5523 7 18 7C17.4477 7 17 6.55228 17 6C17 5.44772 17.4477 5 18 5Z" />
                                            <path d="M18 11C18.5523 11 19 11.4477 19 12C19 12.5523 18.5523 13 18 13C17.4477 13 17 12.5523 17 12C17 11.4477 17.4477 11 18 11Z" />
                                            <path d="M12 11C12.5523 11 13 11.4477 13 12C13 12.5523 12.5523 13 12 13C11.4477 13 11 12.5523 11 12C11 11.4477 11.4477 11 12 11Z" />
                                            <path d="M12 5C12.5523 5 13 5.44772 13 6C13 6.55228 12.5523 7 12 7C11.4477 7 11 6.55228 11 6C11 5.44772 11.4477 5 12 5Z" />
                                            <path d="M18 17C18.5523 17 19 17.4477 19 18C19 18.5523 18.5523 19 18 19C17.4477 19 17 18.5523 17 18C17 17.4477 17.4477 17 18 17Z" />
                                            <path d="M12 17C12.5523 17 13 17.4477 13 18C13 18.5523 12.5523 19 12 19C11.4477 19 11 18.5523 11 18C11 17.4477 11.4477 17 12 17Z" />
                                        </svg> 
                                    </span>
                                </div>
                            } 
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
