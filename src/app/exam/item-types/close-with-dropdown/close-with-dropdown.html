<div class="lg:h-full">
    <div class="rounded-md bg-white lg:h-full flex flex-col w-full">
        <div class="py-1 pr-2">
            <div class="border-l-4 border-primary flex justify-between items-center">
               <div class="font-bold text-sm px-3">
                    <div class="text-primary">{{ store().currentSection?.name }}</div>
                    <div>Question {{ store().currentQuestionIndex + 1 }}</div>
                </div>
                <div class="flex gap-3">
                    <app-answer-tools></app-answer-tools>
                    @if(!store().isPreviewMode) {
                        <app-question-tools [showQuestionModalButton]="false" [showQuestionModalButton]="false"></app-question-tools>
                    }
                </div>
            </div>
        </div>

        <div [style.fontSize.px]="fontSize()" class="overflow-auto h-[1000px] pb-[500px] md:h-full p-3 border-t border-gray-300 border-dashed">

            @if (store().currentQuestion?.passage_stimulus) {
                <div class="editor-content" [innerHTML]="store().currentQuestion?.passage_stimulus | safeHtml"></div>
            }

            <div class="mt-3 editor-content" #contentContainer [innerHTML]="formattedStimulus() | safeHtml"></div>

            <div class="hidden">
                @for(respList of store().currentQuestion?.possible_responses; track $index; let i = $index) {
                    <span #clozeDropdown class="bg-gray-100 inline-flex gap-1 rounded-2xl w-max p-0.5 m-0.5 align-middle">
                        <span class="bg-white inline-flex items-center gap-2 rounded-2xl w-max px-2 border border-gray-200">
                            <select [style.fontSize.px]="fontSize()" class="rounded-full flex-1 border border-transparent outline-none ring-0 py-2 px-3 inline" #dropRef (change)="captureResponses(i, dropRef.value)">
                                <option selected value="">Select answer</option>
                                @for(resp of store().currentQuestion?.possible_responses?.[i]?.responses; track resp.value) {
                                    <option [selected]="store().currentQuestion?.responses?.[i] === resp.value" [value]="resp.value"> {{ resp.label }} </option>
                                }
                            </select>
                        </span>
                    </span>
                }
            </div>

        </div>

    </div>
</div>
