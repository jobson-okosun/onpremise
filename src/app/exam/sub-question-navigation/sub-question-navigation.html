<div class="h-full overflow-y-auto bg-gray-100 p-1 rounded-md flex flex-col gap-4 items-center z-50">
    @for(sq of subQuestions(); track sq.id; let pIdx = $index) {
        @if(sq.children && sq.children.length > 0) {
            <div class="relative w-full flex justify-center sub-question-parent">
                <button (click)="toggleParent(sq.id)"
                    class="flex rounded-md items-center justify-center font-semibold text-sm size-8 cursor-pointer border border-transparent ring-2 ring-transparent ring-offset-1 hover:border-blue-400! transition duration-200 outline-none!"
                    [class.bg-red-200!]="!isAttempted(sq.id)"
                    [class.text-red-600!]="!isAttempted(sq.id)"
                    [class.bg-green-300!]="isAttempted(sq.id)"
                    [class.text-green-800!]="isAttempted(sq.id)"
                    [class.ring-blue-400!]="isChildActive(sq)">
                    {{ getParentLabel(pIdx) }}
                </button>
            </div>
        } @else {
            <button (click)="selectPart(sq.id)"
                class="flex rounded-md items-center justify-center font-semibold text-sm size-8 cursor-pointer border border-transparent ring-2 ring-transparent ring-offset-1 hover:border-blue-400! transition duration-200 outline-none!"
                [class.bg-red-200!]="!isAttempted(sq.id)"
                [class.text-red-600!]="!isAttempted(sq.id)"
                [class.bg-green-300!]="isAttempted(sq.id)"
                [class.text-green-800!]="isAttempted(sq.id)"
                [class.ring-blue-400!]="activeStoreId() == sq.id">
                {{ getParentLabel(pIdx) }}
            </button>
        }

        @if(expandedParentId() === sq.id) {
            <div class="-mt-3 flex flex-col gap-2 bg-white p-0.5 rounded-md border border-primary animate-fadein whitespace-nowrap sub-question-child">
                @for(child of sq.children; track child.id; let cIdx = $index) {
                    <button (click)="selectPart(child.id);"
                        class="flex rounded-md items-center justify-center font-semibold text-sm size-8 cursor-pointer border border-transparent ring-2 ring-transparent ring-offset-1 hover:border-blue-400! transition duration-200 outline-none!"
                        [class.bg-red-200!]="!isAttempted(child.id)"
                        [class.text-red-600!]="!isAttempted(child.id)"
                        [class.bg-green-300!]="isAttempted(child.id)"
                        [class.text-green-800!]="isAttempted(child.id)"
                        [class.ring-blue-400!]="activeStoreId() == child.id">
                        {{ getChildLabel(pIdx, cIdx) }}
                    </button>
                }
            </div>
        }
    }
</div>
