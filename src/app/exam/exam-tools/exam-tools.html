<div class="flex items-center gap-1 py-2 lg:py-0">
    <div class="border border-gray-200 flex items-center gap-2 rounded-2xl w-max p-1 pl-3">
        <span class="text-base font-black">{{ minTimeSpent() }}</span>min{{ minTimeSpent() !== 1 ? 's' : '' }} of
        <span class="bg-gray-100 flex items-center gap-1 rounded-2xl w-max px-3 py-1">
            <span class=" font-black">{{ countDownTimer().min }}:{{ countDownTimer().sec }}</span>
            <i [class.animate-spin]="lastAutosaveTimeDifference() < 300" class="pi pi-clock hidden! lg:block!"></i>
        </span>
    </div> 
    <button type="button" class="rounded-full size-10 flex items-center justify-center hover:bg-gray-100 transition duration-150">
        <i class="pi pi-wifi" [class.text-green-600]="connectionStatus()" [class.text-red-600]="!connectionStatus()"></i>
    </button>
    @if(store().platformIsTauri) {
        <button type="button" class="rounded-full size-10 flex items-center justify-center hover:bg-gray-100 transition duration-150 -rotate-90">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" color="#3c3c3c" fill="none">
                <path d="M2 12C2 9.17157 2 7.75736 2.87868 6.87868C3.75736 6 5.17157 6 8 6H13C15.8284 6 17.2426 6 18.1213 6.87868C19 7.75736 19 9.17157 19 12C19 14.8284 19 16.2426 18.1213 17.1213C17.2426 18 15.8284 18 13 18H8C5.17157 18 3.75736 18 2.87868 17.1213C2 16.2426 2 14.8284 2 12Z" stroke="#3c3c3c" stroke-width="1.5" stroke-linecap="round"></path>
                <path d="M19 9.5L20.0272 9.6712C20.7085 9.78475 21.0491 9.84152 21.3076 10.0067C21.5618 10.1691 21.7612 10.4044 21.8796 10.6819C22 10.964 22 11.3093 22 12C22 12.6907 22 13.036 21.8796 13.3181C21.7612 13.5956 21.5618 13.8309 21.3076 13.9933C21.0491 14.1585 20.7085 14.2153 20.0272 14.3288L19 14.5" stroke="#3c3c3c" stroke-width="1.5" stroke-linecap="round"></path>
                <path d="M6 10V14" stroke="#3c3c3c" stroke-width="1.5" stroke-linecap="round"></path>
                <path d="M9 10V14" stroke="#3c3c3c" stroke-width="1.5" stroke-linecap="round"></path>
            </svg>
        </button>
    }
    @if(!store().platformIsTauri) {
        <button (click)="fullscreen()" type="button" class="hidden lg:flex rounded-full size-10  items-center justify-center hover:bg-gray-100 transition duration-150 bg-gray-100 border border-transparent hover:border-gray-400">
            <svg class="w-6 h-6 text-gray-600" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 4H4m0 0v4m0-4 5 5m7-5h4m0 0v4m0-4-5 5M8 20H4m0 0v-4m0 4 5-5m7 5h4m0 0v-4m0 4-5-5"/>
            </svg>
        </button>
    }
    <button (click)="showCalculator.set(true)" type="button" class="rounded-full size-10 flex items-center justify-center hover:bg-gray-100 transition duration-150 bg-gray-100 border border-transparent hover:border-gray-400">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" color="#3c3c3c" fill="none">
            <path d="M21.5 12.95V11.05C21.5 7.01949 21.5 5.00424 20.1088 3.75212C18.7175 2.5 16.4783 2.5 12 2.5C7.52166 2.5 5.28249 2.5 3.89124 3.75212C2.5 5.00424 2.5 7.01949 2.5 11.05V12.95C2.5 16.9805 2.5 18.9958 3.89124 20.2479C5.28249 21.5 7.52166 21.5 12 21.5C16.4783 21.5 18.7175 21.5 20.1088 20.2479C21.5 18.9958 21.5 16.9805 21.5 12.95Z" stroke="#3c3c3c" stroke-width="1.5"></path>
            <path d="M18 8H14M16 6L16 10" stroke="#3c3c3c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M18 17.5H14" stroke="#3c3c3c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M18 14.5H14" stroke="#3c3c3c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M10 17.5L8.25 15.75M8.25 15.75L6.5 14M8.25 15.75L10 14M8.25 15.75L6.5 17.5" stroke="#3c3c3c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M10 8H6" stroke="#3c3c3c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
    </button>
    <button (click)="resizeFont.emit($event)" type="button" class="rounded-full size-10 flex items-center justify-center hover:bg-gray-100 transition duration-150 bg-gray-100 border border-transparent hover:border-gray-400">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" color="#3c3c3c" fill="none">
            <path d="M14 19L11.1069 10.7479C9.76348 6.91597 9.09177 5 8 5C6.90823 5 6.23652 6.91597 4.89309 10.7479L2 19M4.5 12H11.5" stroke="#141B34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M21.9692 13.9392V18.4392M21.9692 13.9392C22.0164 13.1161 22.0182 12.4891 21.9194 11.9773C21.6864 10.7709 20.4258 10.0439 19.206 9.89599C18.0385 9.75447 17.1015 10.055 16.1535 11.4363M21.9692 13.9392L19.1256 13.9392C18.6887 13.9392 18.2481 13.9603 17.8272 14.0773C15.2545 14.7925 15.4431 18.4003 18.0233 18.845C18.3099 18.8944 18.6025 18.9156 18.8927 18.9026C19.5703 18.8724 20.1955 18.545 20.7321 18.1301C21.3605 17.644 21.9692 16.9655 21.9692 15.9392V13.9392Z" stroke="#141B34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </button>
    <button (click)="overViewActiveTab.set(0);examprogress.toggle($event)" type="button" class="rounded-full size-10 flex items-center justify-center hover:bg-gray-100 transition duration-150 bg-gray-100 border border-transparent hover:border-gray-400">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" color="#3c3c3c" fill="none">
            <path d="M2.5 7.5V13.5C2.5 17.2712 2.5 19.1569 3.67157 20.3284C4.84315 21.5 6.72876 21.5 10.5 21.5H12.5M21.5 11.5V7.5" stroke="#141B34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M3.86909 5.31461L2.5 7.5H21.5L20.2478 5.41303C19.3941 3.99021 18.9673 3.2788 18.2795 2.8894C17.5918 2.5 16.7621 2.5 15.1029 2.5H8.95371C7.32998 2.5 6.51812 2.5 5.84013 2.8753C5.16215 3.2506 4.73113 3.93861 3.86909 5.31461Z" stroke="#141B34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M12 7.5V2.5" stroke="#141B34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M10 10.5H14" stroke="#141B34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M18 15.5V17.5H19.5M22 17.5C22 19.7091 20.2091 21.5 18 21.5C15.7909 21.5 14 19.7091 14 17.5C14 15.2909 15.7909 13.5 18 13.5C20.2091 13.5 22 15.2909 22 17.5Z" stroke="#141B34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </button>
    @if(canEndExam() && countDownTimer().min >= 1){
        <button (click)="endExam()" type="button" class="animate__animated animate__fadeIn hidden! lg:flex! btn rounded-sm! bg-red-700! hover:bg-red-800! px-3!">Submit Exam</button>
    }

    <p-popover #examprogress>
        <app-overview [(activeTab)]="overViewActiveTab"></app-overview>
    </p-popover>

</div>

<p-dialog appendTo="body" header="Simple Calculator" [position]="'bottomright'" [modal]="true" [visible]="showCalculator()" (visibleChange)="showCalculator.set(false)" [style]="{ width: '25rem' }">
    <app-calculator />
</p-dialog>
