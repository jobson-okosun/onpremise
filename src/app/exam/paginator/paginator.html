<div class="flex items-center gap-3 flex-1 justify-center">
    <button (click)="prev()" [disabled]="currentQuestionIndex() == 0" type="button" class="rounded-full w-10 h-10 flex items-center justify-center bg-primary text-white cursor-pointer">
        <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15 19-7-7 7-7"/>
        </svg>
    </button>

    <div class="flex flex-1 justify-center items-center gap-1">
         @for(page of pages(); track page; let i = $index) {
            <button (click)="selectPage(page)"
                class="rounded-full size-8 text-[13px] bg-red-200 text-red-600 flex items-center justify-center transition duration-150 border border-transparent ring-2 ring-transparent ring-offset-1 cursor-pointer font-medium hover:border-blue-400! outline-none!"
                [class.bg-yellow-200!]="isRevisit(page) && isUnattempted(page)"
                [class.text-yellow-800!]="isRevisit(page) && isUnattempted(page)"
                
                [class.ring-blue-400!]="isCurrent(page)"

                [class.bg-green-300!]="isAttempted(page)"
                [class.text-green-800!]="isAttempted(page)"
                >
                {{ page + 1 }}
            </button>
        }
    </div>

    <button (click)="next()" [disabled]="currentQuestionIndex() == (totalQuestions() - 1)" type="button" class="rounded-full w-10 h-10 flex items-center justify-center bg-primary text-white cursor-pointer">
        <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 5 7 7-7 7"/>
        </svg>
    </button>
</div>
